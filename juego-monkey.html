<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IEFA DIGITAL | MONKEY</title>

<style>

/* =====================================================
   COLORES IEFA
===================================================== */

:root{
  --azul:#123B70;
  --azul-claro:#1E5AA8;
  --morado:#6B4BC3;
  --amarillo:#FFD500;
  --negro:#080808;
  --blanco:#ffffff;
  --gris:#f4f4f4;
  --borde:#FFD500;
}


/* =====================================================
   GENERAL
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Trebuchet MS",Arial,sans-serif;
  background:var(--azul);
  color:var(--negro);
  min-height:100vh;
}

.page{
  max-width:1200px;
  margin:auto;
  background:var(--azul);
  border-left:3px solid var(--amarillo);
  border-right:3px solid var(--amarillo);
}


/* =====================================================
   ENCABEZADO
===================================================== */

header{
  min-height:380px;
  padding:45px 6% 40px;

  display:grid;
  grid-template-columns:1.1fr .9fr;

  gap:30px;
  align-items:center;

  border-top:3px solid var(--amarillo);
  border-bottom:3px solid var(--amarillo);
}

.intro{
  text-align:center;
}

.title{
  font-family:Impact,"Arial Black",sans-serif;
  font-size:clamp(36px,5vw,58px);
  letter-spacing:1px;
  margin-bottom:12px;
  color:var(--amarillo);
}

.subtitle{
  font-family:Impact,"Arial Black",sans-serif;
  font-size:clamp(22px,3vw,34px);
  line-height:1.05;
  margin-bottom:36px;
  color:var(--blanco);
}

.back{
  display:inline-block;

  border:0;
  border-radius:999px;

  padding:13px 24px;

  font-weight:900;
  font-size:17px;

  cursor:pointer;

  background:var(--negro);
  color:var(--blanco);

  text-decoration:none;
}

.back:hover{
  opacity:.85;
}

.logo-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
}

.logo{
  width:min(260px,85%);
  filter:drop-shadow(0 8px 0 rgba(0,0,0,.15));
}


/* =====================================================
   JUEGO
===================================================== */

.projects{
  padding:60px 6% 80px;
  border-bottom:3px solid var(--amarillo);
}

.game-frame{
  width:100%;

  max-width:850px;

  margin:0 auto;

  position:relative;

  height:0;

  padding-bottom:117.6%;

  overflow:hidden;

  border-radius:20px;

  border:4px solid var(--morado);

  background:#111;
}

.game-frame iframe{
  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:100%;

  border:0;
}

.game-frame.scratch-frame{
  padding-bottom:82.9%;

  border-color:var(--azul-claro);
}


/* =====================================================
   EVALUACIÓN
===================================================== */

.evaluation{
  margin:30px auto 0;

  max-width:850px;

  background:var(--gris);

  border-radius:24px;

  padding:28px;
}

.evaluation h3{
  font-size:27px;

  margin-bottom:8px;

  color:var(--azul);
}

.note{
  font-size:16px;

  margin-bottom:18px;

  font-weight:700;
}

.form-frame{
  width:100%;

  max-width:850px;

  margin:20px auto 0;

  background:var(--blanco);

  border-radius:20px;

  overflow:hidden;
}

.form-frame iframe{
  width:100%;

  height:900px;

  min-height:900px;

  border:0;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
  text-align:center;

  padding:35px 20px;

  font-weight:900;

  font-size:17px;

  color:var(--blanco);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:850px){

  header{
    grid-template-columns:1fr;

    min-height:auto;

    padding-top:40px;
  }

}

@media(max-width:500px){

  .title{
    font-size:40px;
  }

  .subtitle{
    font-size:26px;
  }

  .projects{
    padding-left:5%;
    padding-right:5%;
  }

}

</style>
</head>


<body>


<div class="page">


<!-- =====================================================
     ENCABEZADO
===================================================== -->

<header>

<section class="intro">

<h1 class="title">
MONKEY
</h1>

<h2 class="subtitle">
Grado 8 · Scratch
</h2>

<a
class="back"
href="scratch.html">

← VOLVER A JUEGOS SCRATCH

</a>

</section>


<div class="logo-wrap">

<img
class="logo"
src="logo-fe-y-alegria.png"
alt="Logo Fe y Alegría">

</div>

</header>



<!-- =====================================================
     JUEGO Y EVALUACIÓN
===================================================== -->

<main class="projects">


<div class="game-frame scratch-frame">

<iframe
src="https://scratch.mit.edu/projects/1369075882/embed"
allowfullscreen="allowfullscreen"
sandbox="allow-popups allow-forms allow-scripts allow-same-origin"
frameborder="0"
title="Monkey">

</iframe>

</div>



<div class="evaluation">

<h3>
⭐ Evalúa MONKEY
</h3>

<p class="note">

Después de jugar, responde la evaluación directamente aquí.

</p>

</div>


<div class="form-frame">

<iframe
src="https://docs.google.com/forms/d/e/1FAIpQLSdcYRBUKk5JpLI_CEoE6rh955nlxQjmMdZxofwmasn6kn_woQ/viewform?usp=pp_url&entry.366340186=8&entry.1373954358=MONKEY"
width="100%"
height="900"
frameborder="0"
marginheight="0"
marginwidth="0">

Cargando…

</iframe>

</div>


</main>



<!-- =====================================================
     PIE DE PÁGINA
===================================================== -->

<footer>

IEFA DIGITAL · Tecnología e Informática · 2026

</footer>


</div>


</body>
</html>
